[package]
name = "markusunkel-com"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", optional = true, features = ["macros"] }
axum-macros = { version = "0.5", optional = true }
base64 = { version = "0.23", optional = true }
blake3 = { version = "1.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = { version = "0.1", optional = true }
fast_image_resize = { version = "6.1", optional = true }
futures = { version = "0.3" }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
image = { version = "0.25", optional = true, default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "avif",
] }
leptos = { version = "0.8.20", features = ["islands", "islands-router"] }
leptos_axum = { version = "0.8", optional = true, features = ["islands-router"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
notify = { version = "8", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
quick-xml = { version = "0.42", optional = true, features = ["serde", "serialize"] }
rand = { version = "0.10.2" }
serde = { version = "1", features = ["derive", "rc"] }
svgm-core = { version = "0.3.8", optional = true }
thiserror = { version = "2.0" }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = [
  "set-header",
  "fs",
  "compression-br",
  "compression-gzip",
], optional = true }
wasm-bindgen = { version = "0.2" }
webp = { version = "0.3", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
ssr = [
  "dep:axum",
  "dep:axum-macros",
  "dep:tower",
  "dep:tower-http",
  "dep:tokio",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:notify",
  "dep:pulldown-cmark",
  "dep:fast_image_resize",
  "dep:image",
  "dep:base64",
  "dep:webp",
  "dep:svgm-core",
  "dep:blake3",
  "dep:quick-xml",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# Must stay off while building with `--split`. wasm-split runs before
# wasm-bindgen, and LTO folds away the `__wbindgen_describe_*` functions, so
# wasm-bindgen then reads an empty descriptor stream and panics with
# "index out of bounds: the len is 0 but the index is 0"
# (cli-support/src/descriptor.rs:324). `lto = "thin"` fails the same way;
# opt-level and codegen-units are not involved.
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "markusunkel-com"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

hash-files = true

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/colorfit.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
